name: HomeTrainerHA
options:
  bundleIdPrefix: fr.lobwick
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  HomeTrainerHA:
    type: application
    platform: iOS
    sources: [HomeTrainerHA]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.lobwick.HomeTrainerHA
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: HomeTrainer → HA
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Se connecter à votre home trainer pour lire puissance, cadence et vitesse.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Envoyer les données du home trainer à Home Assistant sur votre réseau local.
    info:
      path: HomeTrainerHA/Info.plist
      properties:
        UIBackgroundModes: [bluetooth-central]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
